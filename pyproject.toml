[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroplot"
version = "0.1.2"
description = "A lightweight, modular real-time visualization and diagnostics library for PyTorch."
readme = "neuroplot/README.md"
dependencies = [
    "torch",
    "matplotlib",
    "numpy",
    "imageio"
]